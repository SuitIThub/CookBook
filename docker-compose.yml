version: "3.9"
services:
  cookbook:
    build: .
    container_name: cookbook-app
    ports:
      - "4321:4321"
    environment:
      - NODE_ENV=production
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      # Named volume for node_modules to preserve container version
      - cookbook_node_modules:/app/node_modules

volumes:
  cookbook_node_modules:
  