# Builds the Android app and publishes it as a GitHub release whenever
# app/package.json carries a version that has no release yet (version bump, or
# the very first run). The app checks these releases on start and offers the
# update (app/src/lib/appUpdate.ts).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   KOCHBUCH_KEYSTORE_BASE64   base64 of the release keystore (.jks)
#   KOCHBUCH_KEYSTORE_PASSWORD keystore password
#   KOCHBUCH_KEY_ALIAS         key alias (kochbuch)
#   KOCHBUCH_KEY_PASSWORD      key password
# Every release must be signed with the same key, otherwise Android refuses to
# install the update over the existing app.
name: App release

on:
  push:
    branches: [main, standalone-app]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      needed: ${{ steps.release.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(node -p "require('./app/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: app-v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG exists — nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "No release $TAG yet — building."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: app-v${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The app imports the shared core from ../src (database, sync, tracker
      # logic), whose dependencies live in the root package. Install scripts are
      # skipped: native server modules (better-sqlite3) aren't needed here.
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix app

      - name: Build web app
        run: npm run build --prefix app

      - name: Sync Capacitor
        working-directory: app
        run: npx cap sync android

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.KOCHBUCH_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret KOCHBUCH_KEYSTORE_BASE64 fehlt — siehe Kopf von .github/workflows/app-release.yml"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        working-directory: app/android
        env:
          KOCHBUCH_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KOCHBUCH_KEYSTORE_PASSWORD: ${{ secrets.KOCHBUCH_KEYSTORE_PASSWORD }}
          KOCHBUCH_KEY_ALIAS: ${{ secrets.KOCHBUCH_KEY_ALIAS }}
          KOCHBUCH_KEY_PASSWORD: ${{ secrets.KOCHBUCH_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/kochbuch-$VERSION.apk"

      - name: Release notes
        run: |
          PREV=$(git tag --list 'app-v*' --sort=-v:refname | head -n 1)
          {
            echo "Kochbuch-App $VERSION"
            echo
            if [ -n "$PREV" ]; then
              echo "Änderungen seit $PREV:"
              git log --no-merges --pretty='- %s' "$PREV"..HEAD -- app src
            else
              echo "Erste Release der App."
            fi
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$RUNNER_TEMP/kochbuch-$VERSION.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Kochbuch-App $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
